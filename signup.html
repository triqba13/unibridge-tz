<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniBridge | Your Bridge to Global Education</title>
<link rel="icon" type="image/x-icon" href="images/favicon_io/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon_io/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon_io/favicon-32x32.png">
<link rel="apple-touch-icon" href="images/favicon_io/apple-touch-icon.png">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="signup.css">
</head>
<body>
<section class="signup-page">

  <!-- Top Nav -->
  <nav class="top-nav">
    <a href="index.html" class="nav-link-top">Home</a>
    <div class="nav-dot"></div>
    <a href="login.html" class="nav-link-top">Login</a>
    <div class="nav-dot"></div>
    <a href="signup.html" class="nav-active">Sign Up</a>
  </nav>

  <!-- Main Card -->
  <div class="signup-card">

    <div class="card-header">
      <div class="logo-wrap">
        <div class="logo-icon">🎓</div>
        <span class="logo-name">Unibridge</span>
      </div>
      <h1 class="card-title">Create Your <em>Account</em></h1>
      <p class="card-sub">Join thousands of students building their future worldwide.</p>
    </div>

    <button class="btn-google" onclick="handleGoogle()">
     <img src="images/google.png" alt="google image" width="20" height="20" >
      Continue with Google
    </button>

    <div class="divider"><hr><span>OR SIGN UP WITH EMAIL</span><hr></div>

    <div class="form-body">

      <div class="field">
        <label>Full Name</label>
        <div class="input-wrap">
          <input type="text" id="fullname" placeholder="trump john">
          <span class="input-icon"><i class="bi bi-person"></i></span>
        </div>
      </div>

      <div class="field">
        <label>Email Address</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="student@university.ac">
          <span class="input-icon"><i class="bi bi-envelope"></i></span>
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Min. 6 characters">
          <button class="toggle-pw" id="togglePw1" type="button">👁️</button>
          <span class="input-icon"><i class="bi bi-lock"></i></span>
        </div>
        <div class="password-strength" id="strengthBar">
          <div class="strength-track">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" placeholder="Repeat your password">
          <button class="toggle-pw" id="togglePw2" type="button">👁️</button>
          <span class="input-icon"><i class="bi bi-lock-fill"></i></span>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="terms">
        <span class="checkmark" id="chk">✓</span>
        I agree to the <a href="#" class="terms-link">Terms & Conditions</a>
      </label>

      <button class="btn-signup" onclick="handleSignup()">Create Account →</button>

      <p class="form-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </p>

    </div>
  </div>
</section>
<script type="module" src="signup-firebase.js"></script>
</body>
</html>
